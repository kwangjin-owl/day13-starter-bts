<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커피 주문 등록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", -apple-system, sans-serif; background: #f9f7f5; color: #1b1d21; }

  header { background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; padding: 40px 20px; text-align: center; }
  header h1 { font-size: 32px; margin-bottom: 8px; }
  header p { font-size: 14px; opacity: 0.9; }

  .container { max-width: 600px; margin: 40px auto; padding: 20px; }

  .link-back { display: inline-block; margin-bottom: 24px; padding: 8px 16px; background: white; border-radius: 4px; text-decoration: none; color: #6c5ce7; font-size: 14px; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .link-back:hover { box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2); }

  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

  .card-header { background: linear-gradient(135deg, #e8d5f2 0%, #d4e5ff 100%); padding: 32px 20px; text-align: center; }
  .card-header-emoji { font-size: 48px; margin-bottom: 12px; }
  .card-header-title { font-size: 24px; font-weight: 700; color: #1b1d21; }

  .card-body { padding: 32px 20px; }

  label { display: block; margin: 0 0 8px; font-weight: 600; font-size: 14px; color: #333; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    color: #1b1d21;
    font-family: inherit;
    transition: all 0.2s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #6c5ce7;
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
  }

  button {
    width: 100%;
    padding: 14px 22px;
    background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%);
    color: #fff;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .msg {
    margin-top: 16px;
    font-size: 14px;
    display: none;
    padding: 14px 16px;
    border-radius: 8px;
    font-weight: 500;
  }
  .msg.ok {
    display: block;
    background: #e3f2fd;
    color: #1565c0;
  }
  .msg.err {
    display: block;
    background: #ffebee;
    color: #c62828;
  }
</style>
</head>
<body>
  <header>
    <h1>☕ 커피 주문 등록</h1>
    <p>새 주문을 등록합니다</p>
  </header>

  <div class="container">
    <a href="list.html" class="link-back">← 판매 현황 보기</a>

    <div class="card">
      <div class="card-header">
        <div class="card-header-emoji">📝</div>
        <div class="card-header-title">주문하기</div>
      </div>
      <div class="card-body">
        <form id="order-form">
          <label for="buyer_name">구매자 이름</label>
          <input id="buyer_name" name="buyer_name" required placeholder="예: 김하늘">

          <label for="product">메뉴</label>
          <select id="product" name="product" required>
            <option value="아메리카노">아메리카노 (3,000원)</option>
            <option value="카페라떼">카페라떼 (4,000원)</option>
            <option value="율무차">율무차 (3,500원)</option>
            <option value="코코아">코코아 (4,000원)</option>
            <option value="우유">우유 (2,500원)</option>
          </select>

          <label for="quantity">수량</label>
          <input id="quantity" name="quantity" type="number" min="1" value="1" required>

          <button id="btn" type="submit">주문 등록</button>
        </form>
        <div id="msg" class="msg"></div>
      </div>
    </div>
  </div>

<script>
document.getElementById('order-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  msg.className = 'msg';
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        buyer_name: document.getElementById('buyer_name').value,
        product: document.getElementById('product').value,
        quantity: document.getElementById('quantity').value,
      }),
    });
    if (res.ok) {
      msg.textContent = '주문이 등록됐습니다 - 판매 현황에서 확인해 보세요';
      msg.className = 'msg ok';
      e.target.reset();
    } else {
      const body = await res.json().catch(() => ({}));
      msg.textContent = '등록에 실패했습니다: ' + (body.error || res.status);
      msg.className = 'msg err';
    }
  } catch (err) {
    msg.textContent = '연결에 실패했습니다: ' + err.message;
    msg.className = 'msg err';
  }
  btn.disabled = false;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 상세</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", -apple-system, sans-serif; background: #f9f7f5; color: #1b1d21; }

  header { background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; padding: 40px 20px; text-align: center; }
  header h1 { font-size: 32px; }

  .container { max-width: 600px; margin: 40px auto; padding: 20px; }

  .back-link { display: inline-block; margin-bottom: 24px; padding: 8px 16px; background: white; border-radius: 4px; text-decoration: none; color: #6c5ce7; font-size: 14px; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .back-link:hover { box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2); }

  .detail { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }

  .detail-header { background: linear-gradient(135deg, #e8d5f2 0%, #d4e5ff 100%); padding: 40px 20px; text-align: center; }
  .detail-emoji { font-size: 64px; margin-bottom: 16px; }
  .detail-product { font-size: 28px; font-weight: 700; color: #1b1d21; margin-bottom: 8px; }
  .detail-buyer { font-size: 16px; color: #666; }

  .detail-body { padding: 32px 20px; }

  .row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #f0f0f0; }
  .row:last-child { border-bottom: none; }

  .label { font-size: 14px; color: #999; font-weight: 500; }
  .value { font-size: 16px; font-weight: 600; color: #1b1d21; text-align: right; }
  .value.price { font-size: 24px; color: #6c5ce7; }

  .error { color: #d32f2f; padding: 20px; background: #ffebee; border-radius: 8px; text-align: center; }

  .loading { text-align: center; padding: 40px 20px; color: #999; }
</style>
</head>
<body>
  <header>
    <h1>주문 상세</h1>
  </header>

  <div class="container">
    <a href="list.html" class="back-link">← 목록으로 돌아가기</a>
    <div id="content"></div>
  </div>

<script>
const products = {
  '카페라떼': '☕', '아메리카노': '🖤', '코코아': '🟤',
  '우유': '🥛', '율무차': '🍵'
};

async function load() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (!id) {
    document.getElementById('content').innerHTML = '<div class="error">주문번호가 없습니다</div>';
    return;
  }

  document.getElementById('content').innerHTML = '<div class="loading">로딩 중...</div>';

  try {
    const res = await fetch('/api/list?id=' + encodeURIComponent(id));
    if (!res.ok) throw new Error('조회 실패');

    const data = await res.json();
    const emoji = products[data.product] || '☕';
    const purchased = new Date(data.purchased_at);
    const purchaseDate = purchased.toLocaleDateString('ko-KR');
    const purchaseTime = purchased.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

    document.getElementById('content').innerHTML = `
      <div class="detail">
        <div class="detail-header">
          <div class="detail-emoji">${emoji}</div>
          <div class="detail-product">${data.product}</div>
          <div class="detail-buyer">${data.buyer_name}님의 주문</div>
        </div>
        <div class="detail-body">
          <div class="row">
            <span class="label">주문번호</span>
            <span class="value">#${data.id}</span>
          </div>
          <div class="row">
            <span class="label">구매 날짜</span>
            <span class="value">${purchaseDate}</span>
          </div>
          <div class="row">
            <span class="label">구매 시각</span>
            <span class="value">${purchaseTime}</span>
          </div>
          <div class="row">
            <span class="label">수량</span>
            <span class="value">${data.quantity}개</span>
          </div>
          <div class="row">
            <span class="label">단가</span>
            <span class="value">${data.price_per_unit.toLocaleString('ko-KR')}원</span>
          </div>
          <div class="row">
            <span class="label">총액</span>
            <span class="value price">${data.total_price.toLocaleString('ko-KR')}원</span>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="error">조회에 실패했습니다</div>';
  }
}
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", -apple-system, sans-serif; background: #f9f7f5; color: #1b1d21; }

  header { background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; padding: 60px 20px; text-align: center; }
  header h1 { font-size: 36px; margin-bottom: 12px; font-weight: 700; }
  header p { font-size: 15px; opacity: 0.95; }

  .main-wrapper { display: flex; max-width: 1400px; margin: 0 auto; gap: 24px; padding: 20px; }

  .content { flex: 1; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .top-bar .info { font-size: 15px; color: #666; font-weight: 500; }
  .top-bar a { background: #6c5ce7; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.2s; }
  .top-bar a:hover { background: #5f3dc4; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

  .card { background: white; border-radius: 10px; overflow: hidden; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(108, 92, 231, 0.2); }

  .card-image { background: linear-gradient(135deg, #e8d5f2 0%, #d4e5ff 100%); height: 140px; display: flex; align-items: center; justify-content: center; font-size: 56px; }

  .card-body { padding: 14px; }
  .card-id { font-size: 11px; color: #999; margin-bottom: 4px; font-weight: 500; }
  .card-buyer { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
  .card-product { font-size: 15px; font-weight: 700; color: #1b1d21; margin-bottom: 8px; }
  .card-meta { display: flex; justify-content: space-between; font-size: 11px; color: #999; margin-bottom: 8px; }
  .card-price { font-size: 18px; font-weight: 700; color: #6c5ce7; }

  .sidebar { width: 320px; }

  .sidebar-card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }

  .sidebar-title { font-size: 18px; font-weight: 700; color: #1b1d21; margin-bottom: 20px; }

  .stat-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .stat-item:last-child { border-bottom: none; }
  .stat-label { font-size: 13px; color: #666; font-weight: 500; }
  .stat-value { font-size: 20px; font-weight: 700; color: #6c5ce7; }

  .stat-unit { font-size: 11px; color: #999; margin-left: 4px; }

  .sidebar-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: all 0.2s; }
  .sidebar-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(108, 92, 231, 0.3); }

  @media (max-width: 1024px) {
    .main-wrapper { flex-direction: column; }
    .sidebar { width: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>
  <header>
    <h1>☕ 커피 자판기 판매 현황</h1>
    <p>최신 구매가 맨 위에 옵니다</p>
  </header>

  <div class="main-wrapper">
    <div class="content">
      <div class="top-bar">
        <div class="info"><span id="count"></span></div>
        <a href="index.html">+ 새 주문 등록</a>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">📊 판매 요약</div>
        <div class="stat-item">
          <span class="stat-label">총 판매건</span>
          <span class="stat-value" id="stat-count">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">총 판매액</span>
          <span class="stat-value" id="stat-total">0<span class="stat-unit">원</span></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">평균 금액</span>
          <span class="stat-value" id="stat-avg">0<span class="stat-unit">원</span></span>
        </div>
        <button class="sidebar-btn" onclick="location.href='index.html'">주문하기</button>
      </div>

      <div class="sidebar-card">
        <div class="sidebar-title">🔥 인기 상품 TOP 3</div>
        <div id="top-products"></div>
      </div>
    </div>
  </div>

<script>
const products = {
  '카페라떼': '☕', '아메리카노': '🖤', '코코아': '🟤',
  '우유': '🥛', '율무차': '🍵'
};

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기에 실패했습니다';
    return;
  }
  const rows = await res.json();

  document.getElementById('count').textContent = `총 ${rows.length}건`;

  // 그리드 표시
  document.getElementById('grid').innerHTML = rows.map(r => {
    const emoji = products[r.product] || '☕';
    const time = new Date(r.purchased_at);
    const timeStr = time.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="card" onclick="location.href='/detail.html?id=${r.id}'">
        <div class="card-image">${emoji}</div>
        <div class="card-body">
          <div class="card-id">#${r.id}</div>
          <div class="card-buyer">${r.buyer_name}</div>
          <div class="card-product">${r.product}</div>
          <div class="card-meta">
            <span>수량: ${r.quantity}</span>
            <span>${timeStr}</span>
          </div>
          <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        </div>
      </div>`;
  }).join('');

  // 통계 계산
  const totalPrice = rows.reduce((sum, r) => sum + r.total_price, 0);
  const avgPrice = rows.length > 0 ? Math.round(totalPrice / rows.length) : 0;

  document.getElementById('stat-count').textContent = rows.length;
  document.getElementById('stat-total').textContent = totalPrice.toLocaleString('ko-KR');
  document.getElementById('stat-avg').textContent = avgPrice.toLocaleString('ko-KR');

  // 인기 상품 Top 3
  const productCounts = {};
  rows.forEach(r => {
    productCounts[r.product] = (productCounts[r.product] || 0) + r.quantity;
  });

  const topProducts = Object.entries(productCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([name, count], idx) => `
      <div style="padding: 12px 0; ${idx < 2 ? 'border-bottom: 1px solid #f0f0f0;' : ''}">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 14px; font-weight: 600;">
            ${idx + 1}. ${name}
          </span>
          <span style="font-size: 16px; font-weight: 700; color: #6c5ce7;">${count}개</span>
        </div>
      </div>
    `).join('');

  document.getElementById('top-products').innerHTML = topProducts || '<div style="padding: 12px 0; color: #999;">아직 주문이 없습니다</div>';
}
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", -apple-system, sans-serif; background: #f9f7f5; color: #1b1d21; }

  header { background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; padding: 32px 20px; text-align: center; }
  header h1 { font-size: 28px; margin-bottom: 6px; font-weight: 700; }
  header p { font-size: 13px; opacity: 0.9; }

  .main-wrapper { display: flex; max-width: 1400px; margin: 0 auto; gap: 24px; padding: 20px; }

  .content { flex: 1; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar .info { font-size: 15px; color: #666; font-weight: 500; }
  .top-bar a { background: #6c5ce7; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; transition: all 0.2s; }
  .top-bar a:hover { background: #5f3dc4; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }

  .filter-controls { display: flex; gap: 16px; margin-bottom: 24px; align-items: center; flex-wrap: wrap; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
  .tab { padding: 8px 16px; background: #f0f0f0; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: #666; transition: all 0.2s; white-space: nowrap; }
  .tab:hover { background: #e0e0e0; }
  .tab.active { background: #6c5ce7; color: white; }

  .sort-select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: white; color: #333; cursor: pointer; font-family: inherit; }
  .sort-select:hover { border-color: #6c5ce7; }

  .view-toggle { display: flex; gap: 8px; margin-bottom: 20px; }
  .view-btn { padding: 8px 12px; background: white; border: 2px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: #666; transition: all 0.2s; }
  .view-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

  .table-wrapper { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f5f5f5; }
  th { padding: 12px; text-align: left; font-size: 13px; font-weight: 600; color: #666; border-bottom: 2px solid #ddd; }
  td { padding: 12px; font-size: 14px; color: #1b1d21; border-bottom: 1px solid #f0f0f0; }
  tbody tr { cursor: pointer; transition: all 0.2s; }
  tbody tr:hover { background: #f9f7f5; }
  td:last-child { text-align: right; font-weight: 600; color: #6c5ce7; }

  .card { background: white; border-radius: 10px; overflow: hidden; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(108, 92, 231, 0.2); }

  .card-image { background: linear-gradient(135deg, #e8d5f2 0%, #d4e5ff 100%); height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; }

  .card-body { padding: 12px; }
  .card-id { font-size: 10px; color: #bbb; margin-bottom: 2px; font-weight: 400; }
  .card-product { font-size: 15px; font-weight: 700; color: #1b1d21; margin-bottom: 3px; }
  .card-buyer { font-size: 12px; font-weight: 400; color: #888; margin-bottom: 6px; }
  .card-meta { font-size: 10px; color: #aaa; margin-bottom: 8px; }
  .card-price { font-size: 17px; font-weight: 700; color: #6c5ce7; text-align: right; }

  .sidebar { width: 320px; }

  .sidebar-card { background: white; border-radius: 10px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }

  .sidebar-title { font-size: 18px; font-weight: 700; color: #1b1d21; margin-bottom: 20px; }

  .stat-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
  .stat-item:last-child { border-bottom: none; }
  .stat-label { font-size: 13px; color: #666; font-weight: 500; }
  .stat-value { font-size: 20px; font-weight: 700; color: #6c5ce7; }

  .stat-unit { font-size: 11px; color: #999; margin-left: 4px; }

  .sidebar-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: all 0.2s; }
  .sidebar-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(108, 92, 231, 0.3); }

  @media (max-width: 1024px) {
    .main-wrapper { flex-direction: column; }
    .sidebar { width: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>
  <header>
    <h1>☕ 커피 자판기 판매 현황</h1>
    <p>최신 구매가 맨 위에 옵니다</p>
  </header>

  <div class="main-wrapper">
    <div class="content">
      <div class="top-bar">
        <div class="info"><span id="count"></span></div>
        <a href="index.html">+ 새 주문 등록</a>
      </div>

      <div class="filter-controls">
        <div class="tabs" id="tabs">
          <button class="tab active" data-product="all">전체</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
          <span style="font-size: 13px; color: #999; font-weight: 500; white-space: nowrap;">정렬:</span>
          <select class="sort-select" id="sort">
            <option value="latest">최신순 (최근 주문부터)</option>
            <option value="oldest">오래된순 (오래 주문부터)</option>
            <option value="price-high">가격 높은순</option>
            <option value="price-low">가격 낮은순</option>
            <option value="name">구매자명순</option>
          </select>
        </div>
      </div>

      <div class="view-toggle">
        <button class="view-btn active" onclick="toggleView('grid')">⊞ 목록형</button>
        <button class="view-btn" onclick="toggleView('list')">≡ 리스트형</button>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <div class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">📊 판매 요약</div>
        <div class="stat-item">
          <span class="stat-label">총 판매건</span>
          <span class="stat-value"><span id="stat-count">0</span>건</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">총 판매액</span>
          <span class="stat-value"><span id="stat-total">0</span>원</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">평균 금액</span>
          <span class="stat-value"><span id="stat-avg">0</span>원</span>
        </div>
      </div>

      <div class="sidebar-card">
        <div class="sidebar-title">🔥 인기 상품 TOP 3</div>
        <div id="top-products"></div>
      </div>
    </div>
  </div>

<script>
const products = {
  '카페라떼': '☕', '아메리카노': '🖤', '코코아': '🟤',
  '우유': '🥛', '율무차': '🍵'
};

let allRows = [];
let currentFilter = 'all';
let currentSort = 'latest';
let currentView = 'grid';

function renderGrid() {
  // 필터링
  let filtered = currentFilter === 'all'
    ? allRows
    : allRows.filter(r => r.product === currentFilter);

  // 정렬 (명확한 로직)
  const sorted = [...filtered].sort((a, b) => {
    switch(currentSort) {
      case 'latest': {
        const aTime = new Date(a.purchased_at).getTime();
        const bTime = new Date(b.purchased_at).getTime();
        return bTime - aTime; // 최신순: b가 더 최신이면 음수 (b가 앞)
      }
      case 'oldest': {
        const aTime = new Date(a.purchased_at).getTime();
        const bTime = new Date(b.purchased_at).getTime();
        return aTime - bTime; // 오래된순: a가 더 오래이면 음수 (a가 앞)
      }
      case 'price-high': return b.total_price - a.total_price;
      case 'price-low': return a.total_price - b.total_price;
      case 'name': return a.buyer_name.localeCompare(b.buyer_name);
      default: return 0;
    }
  });

  // 개수 업데이트
  document.getElementById('count').textContent = `${filtered.length}건 (전체 ${allRows.length}건)`;

  // 뷰 렌더링
  const grid = document.getElementById('grid');

  if (currentView === 'grid') {
    grid.className = 'grid';
    grid.innerHTML = sorted.map(r => {
      const emoji = products[r.product] || '☕';
      const time = new Date(r.purchased_at);
      const timeStr = time.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="card" onclick="location.href='/detail.html?id=${r.id}'">
          <div class="card-image">${emoji}</div>
          <div class="card-body">
            <div class="card-id">#${r.id}</div>
            <div class="card-buyer">${r.buyer_name}</div>
            <div class="card-product">${r.product}</div>
            <div class="card-meta">
              <span>수량: ${r.quantity}</span>
              <span>${timeStr}</span>
            </div>
            <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
          </div>
        </div>`;
    }).join('');
  } else {
    grid.className = '';
    const time = new Date();
    grid.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>상품</th>
              <th>구매자</th>
              <th>수량</th>
              <th>시간</th>
              <th>금액</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map(r => {
              const t = new Date(r.purchased_at);
              const timeStr = t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
              return `
                <tr onclick="location.href='/detail.html?id=${r.id}'">
                  <td>#${r.id}</td>
                  <td>${r.product}</td>
                  <td>${r.buyer_name}</td>
                  <td>${r.quantity}</td>
                  <td>${timeStr}</td>
                  <td>${r.total_price.toLocaleString('ko-KR')}원</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  }

  updateStats();
}

function updateStats() {
  // 전체 통계 (필터와 무관하게 전체 기준)
  const totalPrice = allRows.reduce((sum, r) => sum + r.total_price, 0);
  const avgPrice = allRows.length > 0 ? Math.round(totalPrice / allRows.length) : 0;

  document.getElementById('stat-count').textContent = allRows.length;
  document.getElementById('stat-total').textContent = totalPrice.toLocaleString('ko-KR');
  document.getElementById('stat-avg').textContent = avgPrice.toLocaleString('ko-KR');

  // 인기 상품 Top 3
  const productCounts = {};
  allRows.forEach(r => {
    productCounts[r.product] = (productCounts[r.product] || 0) + r.quantity;
  });

  const topProducts = Object.entries(productCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([name, count], idx) => `
      <div style="padding: 12px 0; ${idx < 2 ? 'border-bottom: 1px solid #f0f0f0;' : ''}">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 14px; font-weight: 600;">
            ${idx + 1}. ${name}
          </span>
          <span style="font-size: 16px; font-weight: 700; color: #6c5ce7;">${count}개</span>
        </div>
      </div>
    `).join('');

  document.getElementById('top-products').innerHTML = topProducts || '<div style="padding: 12px 0; color: #999;">아직 주문이 없습니다</div>';
}

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기에 실패했습니다';
    return;
  }
  allRows = await res.json();

  // 탭 생성
  const productSet = new Set(allRows.map(r => r.product));
  const tabsHtml = Array.from(productSet).map(p =>
    `<button class="tab" data-product="${p}" onclick="filterByProduct('${p}')">${p}</button>`
  ).join('');
  document.getElementById('tabs').innerHTML =
    `<button class="tab active" data-product="all" onclick="filterByProduct('all')">전체</button>${tabsHtml}`;

  // 정렬 이벤트
  document.getElementById('sort').addEventListener('change', (e) => {
    currentSort = e.target.value;
    renderGrid();
  });

  renderGrid();
}

function filterByProduct(product) {
  currentFilter = product;

  // 탭 활성화 업데이트
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
    if (tab.dataset.product === product) {
      tab.classList.add('active');
    }
  });

  renderGrid();
}

function toggleView(view) {
  currentView = view;

  // 버튼 활성화 업데이트
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');

  renderGrid();
}

load();
</script>
</body>
</html>

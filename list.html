<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판매 현황</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Apple SD Gothic Neo", -apple-system, sans-serif; background: #f9f7f5; color: #1b1d21; }

  header { background: linear-gradient(135deg, #6c5ce7 0%, #74b9ff 100%); color: white; padding: 40px 20px; text-align: center; }
  header h1 { font-size: 32px; margin-bottom: 8px; }
  header p { font-size: 14px; opacity: 0.9; }

  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top-bar .info { font-size: 14px; color: #666; }
  .top-bar a { background: #6c5ce7; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; }
  .top-bar a:hover { background: #5f3dc4; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }

  .card { background: white; border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(108, 92, 231, 0.15); }

  .card-image { background: linear-gradient(135deg, #e8d5f2 0%, #d4e5ff 100%); height: 140px; display: flex; align-items: center; justify-content: center; font-size: 48px; }

  .card-body { padding: 16px; }
  .card-id { font-size: 12px; color: #999; margin-bottom: 4px; }
  .card-buyer { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 8px; }
  .card-product { font-size: 16px; font-weight: 600; color: #1b1d21; margin-bottom: 8px; }
  .card-meta { display: flex; justify-content: space-between; font-size: 12px; color: #999; margin-bottom: 8px; }
  .card-price { font-size: 18px; font-weight: 700; color: #6c5ce7; }
</style>
</head>
<body>
  <header>
    <h1>☕ 커피 자판기 판매 현황</h1>
    <p>최신 구매가 맨 위에 옵니다</p>
  </header>

  <div class="container">
    <div class="top-bar">
      <div class="info"><span id="count"></span></div>
      <a href="index.html">+ 새 주문 등록</a>
    </div>

    <div class="grid" id="grid"></div>
  </div>

<script>
const products = {
  '카페라떼': '☕', '아메리카노': '🖤', '코코아': '🟤',
  '우유': '🥛', '율무차': '🍵'
};

async function load() {
  const res = await fetch('/api/list');
  if (!res.ok) {
    document.getElementById('count').textContent = '불러오기에 실패했습니다';
    return;
  }
  const rows = await res.json();
  document.getElementById('count').textContent = `총 ${rows.length}건`;

  document.getElementById('grid').innerHTML = rows.map(r => {
    const emoji = products[r.product] || '☕';
    const time = new Date(r.purchased_at);
    const timeStr = time.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    return `
      <div class="card" onclick="location.href='/detail.html?id=${r.id}'">
        <div class="card-image">${emoji}</div>
        <div class="card-body">
          <div class="card-id">#${r.id}</div>
          <div class="card-buyer">${r.buyer_name}</div>
          <div class="card-product">${r.product}</div>
          <div class="card-meta">
            <span>수량: ${r.quantity}</span>
            <span>${timeStr}</span>
          </div>
          <div class="card-price">${r.total_price.toLocaleString('ko-KR')}원</div>
        </div>
      </div>`;
  }).join('');
}
load();
</script>
</body>
</html>
